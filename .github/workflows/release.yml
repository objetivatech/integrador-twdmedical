# Publica uma versão: crie uma tag "v0.1.0" e faça push. O instalador e os pacotes de
# atualização vão para o GitHub Releases, de onde o integrador se atualiza sozinho.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Versão a partir da tag
        id: versao
        shell: bash
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: dotnet test tests/TwdIntegrador.Core.Tests -c Release

      - run: dotnet publish src/TwdIntegrador.App -c Release -o publish -p:Version=${{ steps.versao.outputs.v }}

      # TODO: assinar publish\TwdIntegrador.exe aqui quando houver certificado (docs/ASSINATURA-E-DISTRIBUICAO.md).

      - run: dotnet tool install -g vpk --version 1.2.158

      - name: Baixa a versão anterior (para gerar pacote delta)
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Empacota instalador
        run: >
          vpk pack --packId TwdIntegrador --packVersion ${{ steps.versao.outputs.v }}
          --packDir publish --mainExe TwdIntegrador.exe
          --packTitle "TWD Integrador" --packAuthors "TWD Medical"

      - name: Publica no GitHub Releases
        run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --publish
          --releaseName "TWD Integrador ${{ steps.versao.outputs.v }}" --tag ${{ github.ref_name }}
